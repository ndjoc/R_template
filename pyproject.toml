[project]
name = "r-template"
version = "0.1.0"
description = "A reproducible R environment for data analysis, statistics, and visualization"
readme = "README.md"
authors = [
    { name = "Niklas Jocher", email = "niklasdavid.jocher@plus.ac.at" }
]
keywords = [
    "R",
    "data-analysis",
    "statistics",
    "visualization",
    "reproducibility"
]

[project.urls]
repository = "https://github.com/ndjoc/R_template"

[tool.pixi.workspace]
name = "r-template"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tool.pixi.dependencies]
r-base = ">=4.4,<4.5"
r-tidyverse = "*"
"r-data.table" = "*"
r-here = "*"
r-yaml = "*"
r-jsonlite = "*"
r-fs = "*"
r-lme4 = "*"
r-lmertest = "*"
r-emmeans = "*"
r-afex = "*"
r-broom = "*"
r-mgcv = "*"
r-patchwork = "*"
r-ggdist = "*"
r-ggpubr = "*"
r-viridis = "*"
r-targets = "*"
r-tarchetypes = "*"
r-knitr = "*"
r-testthat = "*"
quarto = "*"

[tool.pixi.feature.bayes.dependencies]
r-cmdstanr = "*"
make = "*"
c-compiler = "*"
cxx-compiler = "*"
fortran-compiler = "*"

[tool.pixi.feature.bayes.tasks]
install-brms = "Rscript -e 'install.packages(\"brms\", repos=\"https://cloud.r-project.org\")'"
install-cmdstan = "Rscript -e 'cmdstanr::install_cmdstan()'"
check-cmdstan = "Rscript -e 'cmdstanr::check_cmdstan_toolchain()'"

[tool.pixi.tasks]
setup = "Rscript analysis/00_setup.R"
session = "Rscript -e 'sessionInfo()'"
install-packages = "Rscript R/00_install_packages.R"
test = "Rscript -e 'testthat::test_dir(\"tests/testthat\")'"
report = "quarto render reports/example_erp_report.qmd"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
bayes = { features = ["bayes"], solve-group = "bayes" }